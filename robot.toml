# What the copilot knows about, and where it may write.
#
# Committed on purpose: one person adds a subsystem and the whole team gets it.
# These are document ids, not secrets — they are useless without an API key —
# but they do identify real documents, so scrub this before open-sourcing the
# repo. Same treatment as .mcp.json.
#
# `name`      what a student says: onshape_assembly_overview(where="Intake")
# `url`       copied from the browser address bar with that tab open.
#             Each tab has its own /e/... — copying from the wrong tab is the
#             single most common mistake, which is what `kind` guards against.
# `kind`      partstudio | assembly | featurestudio. Optional but worth setting:
#             it lets a tool refuse a mismatch instead of returning a 400.
# `writable`  THE WRITE BOUNDARY. Enforced in the client, so no code path can
#             route around it. A document must not be marked both ways.
#
# Anything not listed here can still be reached by pasting a URL — but it will
# be read-only, because writability comes from this file alone.

# ---------------------------------------------------------------- the robot
# The season assembly. Read-only, always: this is a real Citrus Circuits robot
# and a copilot that can write into a team's robot the week before a
# competition is an incident waiting to happen.

[[target]]
name = "robot"
url = "https://cad.onshape.com/documents/8d51b49e4b833c57f7d33bf0/w/b6722fcc07bf8d271ff14e47/e/57419d060d54790668e1b5ec"
kind = "assembly"
writable = false

